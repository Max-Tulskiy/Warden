[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-server"
version = "0.1.0"
description = "Server component of the Warden insider-activity monitoring complex"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "psycopg[binary]>=3.1",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "pyjwt>=2.8",
    "argon2-cffi>=23.1",
]

[project.optional-dependencies]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]
testing = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "httpx>=0.27",
    "diff-cover>=9.1",
    "pyyaml>=6.0",
]
dev = ["warden-server[lint,testing]"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "S", "PL", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S106", "PLR2004"]

# FastAPI's dependency-injection markers (Depends/Query/Path/Header/Body) are
# meant to be called in argument defaults - that is how FastAPI recognizes
# them, not the mutable-default-argument hazard B008 otherwise guards against.
[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Header",
    "fastapi.Body",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
warn_redundant_casts = true
strict_equality = true
disallow_incomplete_defs = false
ignore_missing_imports = true
allow_untyped_globals = true
exclude = ["build/", "venv/", "tests/"]

[tool.bandit]
targets = ["src/warden_server"]
skips = ["B101", "B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["src/warden_server"]
