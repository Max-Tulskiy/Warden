          type: string
          format: date-time
          title: Window End
        status:
          $ref: '#/components/schemas/TaskStatus'
      type: object
      required:
      - id
      - kind
      - window_start
      - window_end
      - status
      title: TaskOut
    TaskStatus:
      type: string
