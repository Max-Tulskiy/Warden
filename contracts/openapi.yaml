        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WindowRequestIn:
      properties:
        window_start:
          type: string
          format: date-time
          title: Window Start
        window_end:
          type: string
          format: date-time
          title: Window End
      type: object
      required:
      - window_start
      - window_end
      title: WindowRequestIn
      description: 'A request an operator places for a station''s data over a time
