          - type: 'null'
      additionalProperties: false
      type: object
      title: OperatorUpdateIn
      description: 'The body of `PATCH /api/v1/operators/{id}`: a role, a status,
        or both.


        Any other field is refused, so a password can never ride along in a general

        update; resetting one has its own endpoint with its own rules.'
    PasswordChangeIn:
      properties:
        current_password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Current Password
        new_password:
          type: string
          maxLength: 1024
          minLength: 12
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: PasswordChangeIn
      description: The body of `POST /api/v1/auth/password`.
    PolicyBounds:
      properties:
        max_request_window_hours:
          $ref: '#/components/schemas/Bounds'
        enrollment_token_ttl_hours:
          $ref: '#/components/schemas/Bounds'
        session_lifetime_minutes:
          $ref: '#/components/schemas/Bounds'
      type: object
      required:
      - max_request_window_hours
      - enrollment_token_ttl_hours
      - session_lifetime_minutes
      title: PolicyBounds
      description: The range of each editable value, so the panel never has to copy
        them.
    PolicyOut:
      properties:
        max_request_window_hours:
          type: integer
          title: Max Request Window Hours
        enrollment_token_ttl_hours:
          type: integer
          title: Enrollment Token Ttl Hours
        session_lifetime_minutes:
          type: integer
          title: Session Lifetime Minutes
        min_password_length:
          type: integer
          title: Min Password Length
        max_report_events:
          type: integer
          title: Max Report Events
        max_inventory_entries:
          type: integer
          title: Max Inventory Entries
        max_page_size:
          type: integer
          title: Max Page Size
        overridden:
          type: boolean
          title: Overridden
        defaults:
          $ref: '#/components/schemas/PolicyValues'
        bounds:
          $ref: '#/components/schemas/PolicyBounds'
      type: object
      required:
      - max_request_window_hours
      - enrollment_token_ttl_hours
      - session_lifetime_minutes
      - min_password_length
      - max_report_events
      - max_inventory_entries
      - max_page_size
      - overridden
      - defaults
      - bounds
      title: PolicyOut
      description: 'The operating limits in force, and what an administrator may do
        with them.


        The three editable values are the ones in force now, whether they came from

        a saved policy (`overridden`) or from the server''s configuration. `defaults`

        is what the configuration gives them, which a reset returns to, and `bounds`

        is the range each may take. The other four limits stay in the code.


        An explicit allow-list: every field is named here on purpose, so a secret

        or connection string in `Settings` can never reach the response by being

        added there.'
    PolicyUpdateIn:
      properties:
        max_request_window_hours:
          type: integer
          maximum: 4.0
          minimum: 1.0
          title: Max Request Window Hours
        enrollment_token_ttl_hours:
          type: integer
          maximum: 168.0
          minimum: 1.0
          title: Enrollment Token Ttl Hours
        session_lifetime_minutes:
          type: integer
          maximum: 1440.0
          minimum: 5.0
          title: Session Lifetime Minutes
      additionalProperties: false
      type: object
      required:
      - max_request_window_hours
      - enrollment_token_ttl_hours
      - session_lifetime_minutes
      title: PolicyUpdateIn
      description: 'The body of `PUT /api/v1/policy`: all three values, each within
        its bounds.


        Nothing else is accepted, and each value must be a whole number.'
    PolicyValues:
      properties:
        max_request_window_hours:
          type: integer
          title: Max Request Window Hours
        enrollment_token_ttl_hours:
          type: integer
          title: Enrollment Token Ttl Hours
        session_lifetime_minutes:
          type: integer
          title: Session Lifetime Minutes
      type: object
      required:
      - max_request_window_hours
      - enrollment_token_ttl_hours
      - session_lifetime_minutes
      title: PolicyValues
      description: The three values an administrator can change, whatever their source.
    ReportEventOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        category:
