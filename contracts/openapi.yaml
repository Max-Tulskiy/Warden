          pattern: ^[A-Za-z0-9][A-Za-z0-9._@-]{0,63}$
          title: Username
        role:
          $ref: '#/components/schemas/OperatorRole'
        password:
          type: string
          maxLength: 1024
          minLength: 12
          title: Password
      type: object
      required:
      - username
      - role
      - password
      title: OperatorCreateIn
      description: The body of `POST /api/v1/operators`.
    OperatorOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        username:
          type: string
          title: Username
        role:
          $ref: '#/components/schemas/OperatorRole'
        status:
          $ref: '#/components/schemas/OperatorStatus'
      type: object
      required:
      - id
      - username
      - role
      - status
      title: OperatorOut
