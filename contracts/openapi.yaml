    OperatorPasswordResetIn:
      properties:
        new_password:
          type: string
          maxLength: 1024
          minLength: 12
          title: New Password
      additionalProperties: false
      type: object
      required:
      - new_password
      title: OperatorPasswordResetIn
      description: The body of `POST /api/v1/operators/{id}/password`.
    OperatorRole:
      type: string
