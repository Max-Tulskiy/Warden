openapi: 3.1.0
info:
  title: Warden
  description: Insider-activity monitoring complex server
  version: 0.1.0
paths:
  /api/v1/enrollment-tokens:
    post:
      tags:
      - agents
      summary: Create Enrollment Token
      description: Issue a one-time token an administrator hands to a new agent.
      operationId: create_enrollment_token_api_v1_enrollment_tokens_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenOut'
        '403':
          description: Administrator role required
      security:
      - HTTPBearer: []
  /api/v1/enroll:
    post:
      tags:
      - agents
      summary: Enroll
      description: Register a new agent against a one-time enrollment token.
      operationId: enroll_api_v1_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}:
    patch:
      tags:
      - agents
      summary: Set Agent Status
      description: 'Enable or disable a station.


        Enforcement lives in `require_agent`, which rejects any agent that is not

        `ACTIVE` exactly as it rejects a wrong key; this endpoint only flips the

        flag. Setting the current status again is a no-op and is not audited.'
      operationId: set_agent_status_api_v1_agents__agent_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStatusIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/tasks:
    get:
      tags:
      - agents
      summary: Poll Tasks
      description: Return an agent's pending tasks and mark them dispatched.
      operationId: poll_tasks_api_v1_agents__agent_id__tasks_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: x-agent-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskOut'
                title: Response Poll Tasks Api V1 Agents  Agent Id  Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/reports:
    post:
      tags:
      - agents
      summary: Submit Report
      description: Accept an agent's answer to a previously dispatched window-request
        task.
      operationId: submit_report_api_v1_agents__agent_id__reports_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: x-agent-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportIn'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/inventory:
    post:
      tags:
      - agents
      summary: Submit Inventory
      description: Accept a periodic inventory snapshot; doubles as the agent's heartbeat.
      operationId: submit_inventory_api_v1_agents__agent_id__inventory_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: x-agent-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryIn'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/requests:
    post:
      tags:
      - requests
      summary: Create Window Request
      description: 'Place a request for a station''s data over a bounded time window.


        `WindowRequestIn` already rejects a window over the four-hour ceiling

        (constitution principle 3), with no database; this endpoint additionally

        holds the window to the limit in force, which an administrator may have

        lowered, and confirms the target agent exists and is still active. A

        request placed before the limit was lowered stays as it was placed.'
      operationId: create_window_request_api_v1_agents__agent_id__requests_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowRequestIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      description: Who is signed in and what they may do; the panel shapes itself
        by it.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      security:
      - HTTPBearer: []
  /api/v1/auth/password:
    post:
      tags:
      - auth
      summary: Change Password
      description: 'Change the signed-in operator''s own password.


        A successful change ends every session issued so far and returns a token

        for the new version, so the session that made the change carries on while

        all the others are refused on their next request. A failed attempt ends

        nothing. Failed attempts are throttled under a key of their own, so a

        holder of a stolen token cannot use this endpoint to lock the operator out

        of login.'
      operationId: change_password_api_v1_auth_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout-all:
    post:
      tags:
      - auth
      summary: Logout All
      description: End every session of the signed-in operator, this one included.
      operationId: logout_all_api_v1_auth_logout_all_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /api/v1/agents:
    get:
      tags:
      - reports
      summary: List Agents
      operationId: list_agents_api_v1_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentOut'
                type: array
                title: Response List Agents Api V1 Agents Get
      security:
      - HTTPBearer: []
  /api/v1/agents/{agent_id}/events:
    get:
      tags:
      - reports
      summary: Daily Report
      description: 'Events received for the station on a given day (constitution:
        daily reports).


        The view is recorded in the audit log as `view.daily_report`, under the

        caller''s name, before any event is read; if the entry cannot be stored the

        request fails and no data is returned.'
      operationId: daily_report_api_v1_agents__agent_id__events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: report_date
        in: query
        required: false
        schema:
          type: string
          format: date
          title: Report Date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
                title: Response Daily Report Api V1 Agents  Agent Id  Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/events:
    get:
      tags:
      - reports
      summary: Fleet Report
      description: 'Events across stations for a time range, each labeled with its
        station.


        Reads events the server already holds, which reach it only through window

        requests (constitution principle 2) -- it is not everything the stations

        did. The range is half-open, `[start, end)`, like the window check on

        report ingestion; `id` breaks ties so offset paging stays stable when

        several events share a timestamp.


        The view is recorded in the audit log as `view.fleet_report`, under the

        caller''s name, before any event is read; if the entry cannot be stored the

        request fails and no data is returned.'
      operationId: fleet_report_api_v1_events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End
      - name: agent_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          title: Agent Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EventCategory'
          - type: 'null'
          title: Category
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportEventOut'
                title: Response Fleet Report Api V1 Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/inventory/changes:
    get:
      tags:
      - reports
      summary: Inventory Changes
      description: 'Configuration changes detected for the station, newest first.


        The view is recorded in the audit log as `view.inventory_changes`, under

        the caller''s name, before any change is read; if the entry cannot be stored

        the request fails and no data is returned.'
      operationId: inventory_changes_api_v1_agents__agent_id__inventory_changes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryChangeOut'
                title: Response Inventory Changes Api V1 Agents  Agent Id  Inventory
                  Changes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/policy:
    get:
      tags:
      - policy
      summary: Get Policy
      description: Return the limits in force, and the range and default of each editable
        one.
      operationId: get_policy_api_v1_policy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOut'
      security:
      - HTTPBearer: []
    put:
      tags:
      - policy
      summary: Save Policy
      description: 'Save all three values, putting them in force from the next use.


        A session, an enrollment token, or a queued request that already exists

        keeps what it was issued with. Saving what is already in force writes

        nothing to the audit log.'
      operationId: save_policy_api_v1_policy_put
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PolicyUpdateIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
    delete:
      tags:
      - policy
      summary: Reset Policy
      description: Forget the saved policy, so the server's configured values apply
        again.
      operationId: reset_policy_api_v1_policy_delete
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOut'
        '403':
          description: Administrator role required
      security:
      - HTTPBearer: []
  /api/v1/audit:
    get:
      tags:
      - audit
      summary: Audit Log
      description: 'Audit entries for a time range, newest first.


        The range is half-open, `[start, end)`, like the fleet report. `id` breaks

        ties so offset paging stays stable when several entries share a timestamp.

        Reading the log is itself recorded in it, as `view.audit_log`, before any

        entry is read, so the entry for a read can appear in its own result; if it

        cannot be stored the request fails and no data is returned.


        `action` is either one code or a dotted group: `operator.login` matches

        only itself, `operator` matches every `operator.*`. A plain string prefix

        would let `operator.login` also return `operator.login_failed`.'
      operationId: audit_log_api_v1_audit_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End
      - name: actor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Actor
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9_.]+$
          - type: 'null'
          title: Action
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryOut'
                title: Response Audit Log Api V1 Audit Get
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/operators:
    get:
      tags:
      - operators
      summary: List Operators
      operationId: list_operators_api_v1_operators_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OperatorOut'
                type: array
                title: Response List Operators Api V1 Operators Get
        '403':
          description: Administrator role required
      security:
      - HTTPBearer: []
    post:
      tags:
      - operators
      summary: Create Operator
      description: Create an account. Usernames are unique regardless of letter case.
      operationId: create_operator_api_v1_operators_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorCreateIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/operators/{operator_id}:
    patch:
      tags:
      - operators
      summary: Update Operator
      description: 'Change another account''s role and/or status.


        An administrator cannot address their own account, so the caller always

        remains an active administrator: the panel''s own actions can never leave
        the

        deployment with none. Setting what the account already has is a no-op and

        writes nothing. Disabling ends the account''s sessions; a role change does

        not need to, because the role is read live on every request.'
      operationId: update_operator_api_v1_operators__operator_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorUpdateIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/operators/{operator_id}/password:
    post:
      tags:
      - operators
      summary: Reset Password
      description: 'Set another account''s password, ending its sessions.


        Never one''s own: that goes through the change form, which asks for the

        current password. The account''s login and password-change throttles are

        cleared, so a colleague who was locked out can sign in with the new password.'
      operationId: reset_password_api_v1_operators__operator_id__password_post
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorPasswordResetIn'
      responses:
        '204':
          description: Successful Response
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/tls/ca:
    get:
      tags:
      - tls
      summary: Certificate Authority
      description: 'The certificate authority behind the server''s own certificate.


        Read from the configured file at every request, since the proxy creates

        its authority after the server may already be running. Only the first

        certificate of the file is returned. A deployment whose certificate comes

        from a public authority has no file, and the answer is 404: a station then

        relies on its system''s own trust. This request is not written to the audit

        log: it is unauthenticated, public, and anyone could otherwise grow the log.'
      operationId: certificate_authority_api_v1_tls_ca_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TlsAuthorityOut'
        '404':
          description: The server has no authority of its own
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    AgentOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        hostname:
          type: string
          title: Hostname
        os:
          type: string
          title: Os
        status:
          $ref: '#/components/schemas/AgentStatus'
        enrolled_at:
          type: string
          format: date-time
          title: Enrolled At
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
      type: object
      required:
      - id
      - hostname
      - os
      - status
      - enrolled_at
      - last_seen_at
      title: AgentOut
    AgentStatus:
      type: string
      enum:
      - active
      - disabled
      title: AgentStatus
    AgentStatusIn:
      properties:
        status:
          $ref: '#/components/schemas/AgentStatus'
      type: object
      required:
      - status
      title: AgentStatusIn
      description: 'The body of `PATCH /api/v1/agents/{id}`: enable or disable a station.'
    AuditEntryOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        target:
          type: string
          title: Target
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        detail:
          additionalProperties: true
          type: object
          title: Detail
      type: object
      required:
      - id
      - actor
      - action
      - target
      - occurred_at
      - detail
      title: AuditEntryOut
      description: 'One audit log row.


        `action` stays a plain string on purpose: a row written by an older or a

        newer server must still be readable, so the set of codes is not enforced

        on the way out.'
    Bounds:
      properties:
        min:
          type: integer
          title: Min
        max:
          type: integer
          title: Max
      type: object
      required:
      - min
      - max
      title: Bounds
      description: The lowest and highest value an editable setting may take.
    EnrollRequest:
      properties:
        token:
          type: string
          title: Token
        hostname:
          type: string
          maxLength: 255
          minLength: 1
          title: Hostname
        os:
          type: string
          maxLength: 64
          minLength: 1
          title: Os
      type: object
      required:
