          type: string
          format: date-time
          title: Detected At
        added:
          additionalProperties: true
          type: object
          title: Added
        removed:
          additionalProperties: true
          type: object
          title: Removed
        modified:
          additionalProperties: true
          type: object
          title: Modified
      type: object
      required:
      - id
      - detected_at
      - added
      - removed
      - modified
      title: InventoryChangeOut
    InventoryIn:
      properties:
        hardware:
          additionalProperties: true
          type: object
          maxProperties: 10000
          title: Hardware
        software:
          additionalProperties: true
          type: object
          maxProperties: 10000
          title: Software
      type: object
      title: InventoryIn
      description: 'The body of `POST /api/v1/agents/{id}/inventory`.


        Also doubles as the agent''s heartbeat: the server always updates

        `last_seen_at` on receipt, regardless of whether the snapshot''s content

        actually changed (constitution D-4).'
    LoginRequest:
