openapi: 3.1.0
info:
  title: Warden
  description: Insider-activity monitoring complex server
  version: 0.1.0
paths:
  /api/v1/enrollment-tokens:
    post:
      tags:
      - agents
      summary: Create Enrollment Token
      description: Issue a one-time token an administrator hands to a new agent.
      operationId: create_enrollment_token_api_v1_enrollment_tokens_post
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollmentTokenOut'
        '403':
          description: Administrator role required
      security:
      - HTTPBearer: []
  /api/v1/enroll:
    post:
      tags:
      - agents
      summary: Enroll
      description: Register a new agent against a one-time enrollment token.
      operationId: enroll_api_v1_enroll_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EnrollRequest'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrollResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}:
    patch:
      tags:
      - agents
      summary: Set Agent Status
      description: 'Enable or disable a station.


        Enforcement lives in `require_agent`, which rejects any agent that is not

        `ACTIVE` exactly as it rejects a wrong key; this endpoint only flips the

        flag. Setting the current status again is a no-op and is not audited.'
      operationId: set_agent_status_api_v1_agents__agent_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AgentStatusIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/tasks:
    get:
      tags:
      - agents
      summary: Poll Tasks
      description: Return an agent's pending tasks and mark them dispatched.
      operationId: poll_tasks_api_v1_agents__agent_id__tasks_get
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: x-agent-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/TaskOut'
                title: Response Poll Tasks Api V1 Agents  Agent Id  Tasks Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/reports:
    post:
      tags:
      - agents
      summary: Submit Report
      description: Accept an agent's answer to a previously dispatched window-request
        task.
      operationId: submit_report_api_v1_agents__agent_id__reports_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: x-agent-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportIn'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/inventory:
    post:
      tags:
      - agents
      summary: Submit Inventory
      description: Accept a periodic inventory snapshot; doubles as the agent's heartbeat.
      operationId: submit_inventory_api_v1_agents__agent_id__inventory_post
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: x-agent-key
        in: header
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: X-Agent-Key
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InventoryIn'
      responses:
        '204':
          description: Successful Response
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/requests:
    post:
      tags:
      - requests
      summary: Create Window Request
      description: 'Place a request for a station''s data over a bounded time window.


        `WindowRequestIn` already rejects a window over the configured maximum

        (constitution principle 3); this endpoint only needs to confirm the

        target agent exists.'
      operationId: create_window_request_api_v1_agents__agent_id__requests_post
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WindowRequestIn'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/login:
    post:
      tags:
      - auth
      summary: Login
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/auth/me:
    get:
      tags:
      - auth
      summary: Me
      description: Who is signed in and what they may do; the panel shapes itself
        by it.
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeOut'
      security:
      - HTTPBearer: []
  /api/v1/auth/password:
    post:
      tags:
      - auth
      summary: Change Password
      description: 'Change the signed-in operator''s own password.


        A successful change ends every session issued so far and returns a token

        for the new version, so the session that made the change carries on while

        all the others are refused on their next request. A failed attempt ends

        nothing. Failed attempts are throttled under a key of their own, so a

        holder of a stolen token cannot use this endpoint to lock the operator out

        of login.'
      operationId: change_password_api_v1_auth_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordChangeIn'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/auth/logout-all:
    post:
      tags:
      - auth
      summary: Logout All
      description: End every session of the signed-in operator, this one included.
      operationId: logout_all_api_v1_auth_logout_all_post
      responses:
        '204':
          description: Successful Response
      security:
      - HTTPBearer: []
  /api/v1/agents:
    get:
      tags:
      - reports
      summary: List Agents
      operationId: list_agents_api_v1_agents_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/AgentOut'
                type: array
                title: Response List Agents Api V1 Agents Get
      security:
      - HTTPBearer: []
  /api/v1/agents/{agent_id}/events:
    get:
      tags:
      - reports
      summary: Daily Report
      description: 'Events received for the station on a given day (constitution:
        daily reports).'
      operationId: daily_report_api_v1_agents__agent_id__events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: report_date
        in: query
        required: false
        schema:
          type: string
          format: date
          title: Report Date
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/EventOut'
                title: Response Daily Report Api V1 Agents  Agent Id  Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/events:
    get:
      tags:
      - reports
      summary: Fleet Report
      description: 'Events across stations for a time range, each labeled with its
        station.


        Reads events the server already holds, which reach it only through window

        requests (constitution principle 2) -- it is not everything the stations

        did. The range is half-open, `[start, end)`, like the window check on

        report ingestion; `id` breaks ties so offset paging stays stable when

        several events share a timestamp.'
      operationId: fleet_report_api_v1_events_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End
      - name: agent_id
        in: query
        required: false
        schema:
          type: array
          items:
            type: string
            format: uuid
          title: Agent Id
      - name: category
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/EventCategory'
          - type: 'null'
          title: Category
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ReportEventOut'
                title: Response Fleet Report Api V1 Events Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/agents/{agent_id}/inventory/changes:
    get:
      tags:
      - reports
      summary: Inventory Changes
      operationId: inventory_changes_api_v1_agents__agent_id__inventory_changes_get
      security:
      - HTTPBearer: []
      parameters:
      - name: agent_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Agent Id
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/InventoryChangeOut'
                title: Response Inventory Changes Api V1 Agents  Agent Id  Inventory
                  Changes Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/policy:
    get:
      tags:
      - policy
      summary: Get Policy
      description: Return the limits the server enforces, read from where they are
        enforced.
      operationId: get_policy_api_v1_policy_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PolicyOut'
      security:
      - HTTPBearer: []
  /api/v1/audit:
    get:
      tags:
      - audit
      summary: Audit Log
      description: 'Audit entries for a time range, newest first.


        The range is half-open, `[start, end)`, like the fleet report. `id` breaks

        ties so offset paging stays stable when several entries share a timestamp.

        Reading the log is not itself recorded in it, like every other read.


        `action` is either one code or a dotted group: `operator.login` matches

        only itself, `operator` matches every `operator.*`. A plain string prefix

        would let `operator.login` also return `operator.login_failed`.'
      operationId: audit_log_api_v1_audit_get
      security:
      - HTTPBearer: []
      parameters:
      - name: start
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: Start
      - name: end
        in: query
        required: true
        schema:
          type: string
          format: date-time
          title: End
      - name: actor
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 255
          - type: 'null'
          title: Actor
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
            pattern: ^[a-z0-9_.]+$
          - type: 'null'
          title: Action
      - name: limit
        in: query
        required: false
        schema:
          type: integer
          maximum: 2000
          minimum: 1
          default: 500
          title: Limit
      - name: offset
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: Offset
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AuditEntryOut'
                title: Response Audit Log Api V1 Audit Get
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/operators:
    get:
      tags:
      - operators
      summary: List Operators
      operationId: list_operators_api_v1_operators_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                items:
                  $ref: '#/components/schemas/OperatorOut'
                type: array
                title: Response List Operators Api V1 Operators Get
        '403':
          description: Administrator role required
      security:
      - HTTPBearer: []
    post:
      tags:
      - operators
      summary: Create Operator
      description: Create an account. Usernames are unique regardless of letter case.
      operationId: create_operator_api_v1_operators_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorCreateIn'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - HTTPBearer: []
  /api/v1/operators/{operator_id}:
    patch:
      tags:
      - operators
      summary: Update Operator
      description: 'Change another account''s role and/or status.


        An administrator cannot address their own account, so the caller always

        remains an active administrator: the panel''s own actions can never leave
        the

        deployment with none. Setting what the account already has is a no-op and

        writes nothing. Disabling ends the account''s sessions; a role change does

        not need to, because the role is read live on every request.'
      operationId: update_operator_api_v1_operators__operator_id__patch
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorUpdateIn'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OperatorOut'
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /api/v1/operators/{operator_id}/password:
    post:
      tags:
      - operators
      summary: Reset Password
      description: 'Set another account''s password, ending its sessions.


        Never one''s own: that goes through the change form, which asks for the

        current password. The account''s login and password-change throttles are

        cleared, so a colleague who was locked out can sign in with the new password.'
      operationId: reset_password_api_v1_operators__operator_id__password_post
      security:
      - HTTPBearer: []
      parameters:
      - name: operator_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
          title: Operator Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OperatorPasswordResetIn'
      responses:
        '204':
          description: Successful Response
        '403':
          description: Administrator role required
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /health:
    get:
      tags:
      - health
      summary: Health
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties:
                  type: string
                type: object
                title: Response Health Health Get
components:
  schemas:
    AgentOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        hostname:
          type: string
          title: Hostname
        os:
          type: string
          title: Os
        status:
          $ref: '#/components/schemas/AgentStatus'
        enrolled_at:
          type: string
          format: date-time
          title: Enrolled At
        last_seen_at:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Last Seen At
      type: object
      required:
      - id
      - hostname
      - os
      - status
      - enrolled_at
      - last_seen_at
      title: AgentOut
    AgentStatus:
      type: string
      enum:
      - active
      - disabled
      title: AgentStatus
    AgentStatusIn:
      properties:
        status:
          $ref: '#/components/schemas/AgentStatus'
      type: object
      required:
      - status
      title: AgentStatusIn
      description: 'The body of `PATCH /api/v1/agents/{id}`: enable or disable a station.'
    AuditEntryOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        actor:
          type: string
          title: Actor
        action:
          type: string
          title: Action
        target:
          type: string
          title: Target
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        detail:
          additionalProperties: true
          type: object
          title: Detail
      type: object
      required:
      - id
      - actor
      - action
      - target
      - occurred_at
      - detail
      title: AuditEntryOut
      description: 'One audit log row.


        `action` stays a plain string on purpose: a row written by an older or a

        newer server must still be readable, so the set of codes is not enforced

        on the way out.'
    EnrollRequest:
      properties:
        token:
          type: string
          title: Token
        hostname:
          type: string
          maxLength: 255
          minLength: 1
          title: Hostname
        os:
          type: string
          maxLength: 64
          minLength: 1
          title: Os
      type: object
      required:
      - token
      - hostname
      - os
      title: EnrollRequest
    EnrollResponse:
      properties:
        agent_id:
          type: string
          format: uuid
          title: Agent Id
        agent_key:
          type: string
          title: Agent Key
      type: object
      required:
      - agent_id
      - agent_key
      title: EnrollResponse
    EnrollmentTokenOut:
      properties:
        token:
          type: string
          title: Token
        expires_at:
          type: string
          format: date-time
          title: Expires At
      type: object
      required:
      - token
      - expires_at
      title: EnrollmentTokenOut
      description: The plaintext token, returned once at creation time and never again.
    EventCategory:
      type: string
      enum:
      - removable_media
      - printing
      - processes
      - web
      title: EventCategory
    EventIn:
      properties:
        category:
          $ref: '#/components/schemas/EventCategory'
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - category
      - occurred_at
      title: EventIn
    EventOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        category:
          $ref: '#/components/schemas/EventCategory'
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        payload:
          additionalProperties: true
          type: object
          title: Payload
      type: object
      required:
      - id
      - category
      - occurred_at
      - payload
      title: EventOut
    HTTPValidationError:
      properties:
        detail:
          items:
            $ref: '#/components/schemas/ValidationError'
          type: array
          title: Detail
      type: object
      title: HTTPValidationError
    InventoryChangeOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        detected_at:
          type: string
          format: date-time
          title: Detected At
        added:
          additionalProperties: true
          type: object
          title: Added
        removed:
          additionalProperties: true
          type: object
          title: Removed
        modified:
          additionalProperties: true
          type: object
          title: Modified
      type: object
      required:
      - id
      - detected_at
      - added
      - removed
      - modified
      title: InventoryChangeOut
    InventoryIn:
      properties:
        hardware:
          additionalProperties: true
          type: object
          maxProperties: 10000
          title: Hardware
        software:
          additionalProperties: true
          type: object
          maxProperties: 10000
          title: Software
      type: object
      title: InventoryIn
      description: 'The body of `POST /api/v1/agents/{id}/inventory`.


        Also doubles as the agent''s heartbeat: the server always updates

        `last_seen_at` on receipt, regardless of whether the snapshot''s content

        actually changed (constitution D-4).'
    LoginRequest:
      properties:
        username:
          type: string
          maxLength: 255
          minLength: 1
          title: Username
        password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Password
      type: object
      required:
      - username
      - password
      title: LoginRequest
    MeOut:
      properties:
        username:
          type: string
          title: Username
        role:
          $ref: '#/components/schemas/OperatorRole'
      type: object
      required:
      - username
      - role
      title: MeOut
      description: Who the signed-in operator is and what they may do.
    OperatorCreateIn:
      properties:
        username:
          type: string
          pattern: ^[A-Za-z0-9][A-Za-z0-9._@-]{0,63}$
          title: Username
        role:
          $ref: '#/components/schemas/OperatorRole'
        password:
          type: string
          maxLength: 1024
          minLength: 12
          title: Password
      type: object
      required:
      - username
      - role
      - password
      title: OperatorCreateIn
      description: The body of `POST /api/v1/operators`.
    OperatorOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        username:
          type: string
          title: Username
        role:
          $ref: '#/components/schemas/OperatorRole'
        status:
          $ref: '#/components/schemas/OperatorStatus'
      type: object
      required:
      - id
      - username
      - role
      - status
      title: OperatorOut
      description: 'An account as an administrator sees it: never any password data.'
    OperatorPasswordResetIn:
      properties:
        new_password:
          type: string
          maxLength: 1024
          minLength: 12
          title: New Password
      additionalProperties: false
      type: object
      required:
      - new_password
      title: OperatorPasswordResetIn
      description: The body of `POST /api/v1/operators/{id}/password`.
    OperatorRole:
      type: string
      enum:
      - admin
      - viewer
      title: OperatorRole
      description: What an account may do. Two roles, enforced by the server (D-10).
    OperatorStatus:
      type: string
      enum:
      - active
      - disabled
      title: OperatorStatus
    OperatorUpdateIn:
      properties:
        role:
          anyOf:
          - $ref: '#/components/schemas/OperatorRole'
          - type: 'null'
        status:
          anyOf:
          - $ref: '#/components/schemas/OperatorStatus'
          - type: 'null'
      additionalProperties: false
      type: object
      title: OperatorUpdateIn
      description: 'The body of `PATCH /api/v1/operators/{id}`: a role, a status,
        or both.


        Any other field is refused, so a password can never ride along in a general

        update; resetting one has its own endpoint with its own rules.'
    PasswordChangeIn:
      properties:
        current_password:
          type: string
          maxLength: 1024
          minLength: 1
          title: Current Password
        new_password:
          type: string
          maxLength: 1024
          minLength: 12
          title: New Password
      type: object
      required:
      - current_password
      - new_password
      title: PasswordChangeIn
      description: The body of `POST /api/v1/auth/password`.
    PolicyOut:
      properties:
        max_request_window_hours:
          type: integer
          title: Max Request Window Hours
        enrollment_token_ttl_hours:
          type: integer
          title: Enrollment Token Ttl Hours
        session_lifetime_minutes:
          type: integer
          title: Session Lifetime Minutes
        min_password_length:
          type: integer
          title: Min Password Length
        max_report_events:
          type: integer
          title: Max Report Events
        max_inventory_entries:
          type: integer
          title: Max Inventory Entries
        max_page_size:
          type: integer
          title: Max Page Size
      type: object
      required:
      - max_request_window_hours
      - enrollment_token_ttl_hours
      - session_lifetime_minutes
      - min_password_length
      - max_report_events
      - max_inventory_entries
      - max_page_size
      title: PolicyOut
      description: 'Server limits an administrator can see but not change from the
        panel.


        An explicit allow-list: every field is named here on purpose, so a secret

        or connection string in `Settings` can never reach the response by being

        added there.'
    ReportEventOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        category:
          $ref: '#/components/schemas/EventCategory'
        occurred_at:
          type: string
          format: date-time
          title: Occurred At
        payload:
          additionalProperties: true
          type: object
          title: Payload
        agent_id:
          type: string
          format: uuid
