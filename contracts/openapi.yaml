          maxItems: 10000
          title: Events
      type: object
      required:
      - task_id
      title: ReportIn
      description: 'The body of `POST /api/v1/agents/{id}/reports`: an agent''s answer
        to one task.'
    TaskKind:
      type: string
      enum:
      - window_request
      title: TaskKind
    TaskOut:
      properties:
        id:
          type: string
          format: uuid
          title: Id
        kind:
          $ref: '#/components/schemas/TaskKind'
        window_start:
          type: string
          format: date-time
          title: Window Start
        window_end:
          type: string
          format: date-time
          title: Window End
        status:
          $ref: '#/components/schemas/TaskStatus'
      type: object
      required:
      - id
      - kind
      - window_start
      - window_end
      - status
      title: TaskOut
    TaskStatus:
      type: string
      enum:
      - pending
      - dispatched
      - completed
      - failed
      title: TaskStatus
    TlsAuthorityOut:
      properties:
        pem:
          type: string
          title: Pem
        sha256:
          type: string
          pattern: ^[0-9a-f]{64}$
          title: Sha256
      type: object
      required:
      - pem
      - sha256
      title: TlsAuthorityOut
      description: 'The certificate authority that issued the server''s own certificate.


        `sha256` is the SHA-256 of the certificate''s DER form in lowercase hex:

        the value an administrator compares between the panel and the agent''s

        window before an agent trusts the authority. A station computes the

        fingerprint again itself and does not rely on this field.'
    TokenResponse:
      properties:
        access_token:
          type: string
          title: Access Token
        token_type:
          type: string
          title: Token Type
          default: bearer
      type: object
      required:
      - access_token
      title: TokenResponse
    ValidationError:
      properties:
        loc:
          items:
            anyOf:
            - type: string
            - type: integer
          type: array
          title: Location
        msg:
          type: string
          title: Message
        type:
          type: string
          title: Error Type
        input:
          title: Input
        ctx:
          type: object
          title: Context
      type: object
      required:
      - loc
      - msg
      - type
      title: ValidationError
    WindowRequestIn:
      properties:
        window_start:
          type: string
          format: date-time
          title: Window Start
        window_end:
          type: string
          format: date-time
          title: Window End
      type: object
      required:
      - window_start
      - window_end
      title: WindowRequestIn
      description: 'A request an operator places for a station''s data over a time
        window.


        The window is capped at the constant four-hour ceiling (constitution

        principle 3); this is the server-side half of the check that is repeated

        independently on the agent, and it needs no database. The limit an

        administrator may have set below the ceiling is enforced by the endpoint.'
  securitySchemes:
    HTTPBearer:
      type: http
      scheme: bearer
