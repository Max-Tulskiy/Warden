[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "warden-agent"
version = "0.1.0"
description = "Workstation agent of the Warden insider-activity monitoring complex"
requires-python = ">=3.12"
license = { text = "Proprietary" }
dependencies = [
    "certifi>=2024.2",
    "httpx>=0.27",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psutil>=6.0",
    "tomli>=2.0; python_version < '3.11'",
]

[project.optional-dependencies]
linux = [
    "pyudev>=0.24; sys_platform == 'linux'",
]
windows = [
    "pywin32>=306; sys_platform == 'win32'",
]
# The connection window (warden_agent.configurator.view). The Essentials
# distribution carries QtCore, QtGui and QtWidgets, which is all the window
# uses, at a fraction of the size of the full PySide6 package. Cross-platform,
# so the window can be built and tested off screen on every CI leg.
gui = [
    "PySide6-Essentials>=6.7",
]
lint = [
    "ruff>=0.6",
    "mypy>=1.11",
    "bandit>=1.7",
]
testing = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-asyncio>=0.24",
    "diff-cover>=9.1",
    "pytest-qt>=4.4",
    # Issues the throwaway certificate authority and certificates the TLS tests
    # run against (a real handshake on localhost, never a system store).
    "trustme>=1.1",
    # Test-only, never a runtime dependency of the distributed agent package
    # (production `dependencies` above has no reference to it): the
    # integration suite drives the real server app in-process over
    # httpx.ASGITransport, with no network socket, to check the two sides of
    # the contract against each other directly rather than by hand-written
    # fixtures on each side (constitution principle 11).
    "warden-server @ file:../server",
]
dev = ["warden-agent[lint,testing,linux,windows,gui]"]

[project.scripts]
warden-agent = "warden_agent.__main__:main"
warden-agent-config = "warden_agent.configurator.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "C", "B", "S", "PL", "RUF"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**" = ["S101", "S106", "PLR2004"]
# Windows/Linux OS backends legitimately import platform-only modules
# (winreg, pyudev, win32evtlog) - unavoidable for principle 1's isolation.
"src/warden_agent/**/windows.py" = ["PLC0415"]
# The connection window's Russian text lives in one catalog (constitution
# principle 9). RUF001 flags Cyrillic letters that look like Latin ones, which
# is the whole point of that file.
"src/warden_agent/configurator/messages.py" = ["RUF001"]
"tests/unit/test_configurator/*.py" = ["RUF001"]
"src/warden_agent/collectors/**/linux.py" = ["PLC0415"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.mypy]
python_version = "3.12"
show_error_codes = true
warn_return_any = false
warn_unused_ignores = true
disallow_untyped_defs = false
warn_redundant_casts = true
strict_equality = true
disallow_incomplete_defs = false
ignore_missing_imports = true
allow_untyped_globals = true
exclude = ["build/", "venv/", "tests/"]

# mypy resolves winreg against the *current* platform's typeshed stub; run on
# macOS/Linux, HKEY_LOCAL_MACHINE et al. genuinely do not exist there, so this
# module can only be attribute-checked for real on a windows-latest CI run.
# The transformation logic these backends delegate to (parse_uninstall_entries
# and its siblings) has no such gap and is fully checked above.
[[tool.mypy.overrides]]
module = "warden_agent.collectors.*.windows"
disable_error_code = ["attr-defined"]

[tool.bandit]
targets = ["src/warden_agent"]
skips = ["B101", "B404"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/warden_agent"]
