# Builds installers and container images and publishes them to a GitHub
# Release, triggered by pushing a tag matching `v*` (e.g. `v0.1.0`).
#
# It can also be run by hand (workflow_dispatch) from any branch. That run
# builds only the Windows installer, attaches it to the run as an artifact
# and publishes nothing: no release, no container image, no package. It exists
# so the installer can be compiled, and tried on a real Windows machine,
# before a tag is pushed.
#
# linux-agent-package and windows-agent-installer both freeze the agent
# with PyInstaller first: the Linux job freezes warden_agent/__main__.py
# (the plain CLI, run under systemd as a foreground process); the Windows
# job freezes warden_agent/service/windows.py instead, because that is the
# module that actually speaks the Service Control Manager's protocol via
# pywin32 -- __main__.py alone would not work as a Windows service.
#
# windows-agent-installer is the least-verified job in this workflow (no
# Windows machine on the development side, constitution Section VI): its
# first real run is this workflow's own first run, not a local dry run
# beforehand. It freezes two programs: the service, and the connection window
# (warden_agent/configurator/windows.py) as a folder, whose executable asks
# for administrator rights. amd64 only for now, on both platforms -- PyInstaller
# does not cross-compile, and arm64 runners are not part of this pipeline
# yet.
name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  REGISTRY: ghcr.io

jobs:
  version:
    name: derive version from the tag
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      # A tag gives the version; a run started by hand has none, and the
      # installer only needs a valid one.
      - id: version
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "version=0.0.0" >> "$GITHUB_OUTPUT"
          fi

  docker-images:
    name: server + web container images
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        component: [server, web]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # A registry refuses upper case in an image name, while the owner and
      # repository names in github.repository keep the case they were
      # created with.
      - id: image
        run: echo "name=${REGISTRY}/${GITHUB_REPOSITORY,,}/${{ matrix.component }}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.component }}
          push: true
          tags: |
            ${{ steps.image.outputs.name }}:${{ needs.version.outputs.version }}
            ${{ steps.image.outputs.name }}:latest

  python-packages:
    name: ${{ matrix.component }} wheel + sdist
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [server, agent]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install build
      - run: python -m build
        working-directory: ${{ matrix.component }}
      - uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.component }}/dist/*

  linux-agent-package:
    name: Linux agent package (.deb + .rpm)
    needs: version
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyinstaller
        working-directory: agent
      - name: Freeze warden-agent
        working-directory: agent
        run: >
          pyinstaller --onefile --name warden-agent
          --distpath ../dist src/warden_agent/__main__.py
      # A pinned release: the asset name carries the version, so there is no
      # stable "latest" URL to download, and a build that fetched whatever
      # is newest would change without a commit in this repository.
      - name: Install nfpm
        env:
          NFPM_TOOL_VERSION: "2.47.0"
        run: |
          curl -sSfL "https://github.com/goreleaser/nfpm/releases/download/v${NFPM_TOOL_VERSION}/nfpm_${NFPM_TOOL_VERSION}_amd64.deb" -o /tmp/nfpm.deb
          sudo dpkg -i /tmp/nfpm.deb
      - name: Build .deb and .rpm
        working-directory: packaging/nfpm
        env:
          NFPM_ARCH: amd64
          NFPM_VERSION: ${{ needs.version.outputs.version }}
        run: |
          nfpm package --config nfpm.yaml --packager deb --target ../../warden-agent_${{ needs.version.outputs.version }}_amd64.deb
          nfpm package --config nfpm.yaml --packager rpm --target ../../warden-agent-${{ needs.version.outputs.version }}.x86_64.rpm
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            warden-agent_${{ needs.version.outputs.version }}_amd64.deb
            warden-agent-${{ needs.version.outputs.version }}.x86_64.rpm

  windows-agent-installer:
    name: Windows agent installer (.msi)
    needs: version
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" pyinstaller
        working-directory: agent
      # win32timezone is imported by pywin32 from its C code at run time,
      # where PyInstaller's import analysis cannot see it; a frozen service
      # without it fails the first time pywin32 converts a time value.
      - name: Freeze warden-agent service
        working-directory: agent
        run: >
          pyinstaller --onefile --name warden-agent
          --hidden-import win32timezone
          --distpath ../dist src/warden_agent/service/windows.py
      # The connection window is frozen as a folder, not one file: the Qt
      # libraries stay separate files that can be replaced (PySide6 is
      # LGPLv3), and nothing is unpacked into %TEMP% at every start.
      # --uac-admin makes Windows ask for administrator rights when it is
      # opened, since the agent's folder is closed to everyone else. The view
      # (and Qt behind it) is imported by name at run time, where PyInstaller's
      # analysis cannot see it, so it is named here.
      - name: Freeze the connection window
        working-directory: agent
        run: >
          pyinstaller --onedir --windowed --uac-admin --name warden-agent-config
          --hidden-import win32timezone
          --hidden-import warden_agent.configurator.view
          --distpath ../dist src/warden_agent/configurator/windows.py
      # Builds the window off screen and leaves. A Qt plugin the freeze missed
      # fails the build here, not on the first administrator's desk.
      - name: The frozen window starts
        shell: pwsh
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $window = Start-Process -FilePath "dist/warden-agent-config/warden-agent-config.exe" -ArgumentList "--selftest" -Wait -PassThru
          if ($window.ExitCode -ne 0) { throw "the frozen window did not start (exit code $($window.ExitCode))" }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"
      - name: Build the .msi
        working-directory: packaging/windows
        shell: bash
        run: >
          dotnet build warden-agent.wixproj
          -p:WardenVersion=${{ needs.version.outputs.version }}
          -p:WardenAgentExePath=../../dist/warden-agent.exe
          -p:WardenConfigExamplePath=config.example.toml
          -p:WardenConfiguratorDirPath=../../dist/warden-agent-config
      # Kept on the run itself, so an installer built by hand can be downloaded
      # and tried without publishing a release.
      - uses: actions/upload-artifact@v4
        with:
          name: warden-agent-msi
          path: packaging/windows/bin/**/*.msi
      - uses: softprops/action-gh-release@v2
        if: github.ref_type == 'tag'
        with:
          files: packaging/windows/bin/**/*.msi
