# A single-page app: any path that is not a real static file falls back to
# index.html, so client-side routing (react-router) handles it instead of
# nginx returning a 404 for e.g. a direct load of /agents/<id>.
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri /index.html;
    }
}
